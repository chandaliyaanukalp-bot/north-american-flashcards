<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>North American Flashcards</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#202428;color:#f4f4f4;overflow:hidden}
body{display:flex;flex-direction:column}
.top{height:82px;display:flex;align-items:flex-start;justify-content:space-between;padding:17px 24px 0 28px}
.title{font-size:22px;font-weight:400;letter-spacing:.1px}
.topbtn{margin-top:31px;border:1px solid #3d4248;background:#24282d;color:#ddd;border-radius:24px;padding:9px 22px;font-size:13px;cursor:pointer}
.actions{display:flex;gap:23px;align-items:center;color:#ddd;font-size:23px}
.action{cursor:pointer;user-select:none}
.wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:30px}
.hint{color:#92979b;font-size:13px;margin-bottom:18px}
.card{width:min(564px,calc(100vw - 40px));min-height:255px;background:#30302f;border-radius:38px;padding:27px 25px 20px;display:flex;flex-direction:column;position:relative;box-shadow:0 10px 35px #0002;cursor:pointer}
.num{font-size:13px;color:#a8abad;margin:1px 0 40px 0}
.q{font-size:27px;line-height:1.48;font-weight:400;margin:auto 0;text-align:left}
.answer{font-size:22px;line-height:1.5;color:#eee}
.see{font-size:13px;color:#8e9294;text-align:center;margin-top:22px}
.menu{position:absolute;right:21px;top:24px;font-size:22px;color:#ddd}
.controls{display:flex;align-items:center;gap:26px;margin-top:13px}
.ctrl{width:58px;height:58px;border-radius:50%;border:1px solid #454b50;background:#252a2e;color:#b8b9ba;display:flex;align-items:center;justify-content:center;font-size:25px;cursor:pointer;user-select:none}
.mark{width:74px;border-radius:31px;gap:8px;font-size:20px}
.bad{color:#ff4c42} .good{color:#42d77b} .next{color:#7187ff}
.mark.selected{background:#3a3f44;box-shadow:0 0 0 2px currentColor inset}
.stats{position:absolute;left:28px;bottom:18px;color:#777d82;font-size:12px}
kbd{font-family:inherit}
@media(max-width:600px){
 .top{padding-left:16px;padding-right:16px} .actions{gap:14px}
 .q{font-size:22px} .answer{font-size:18px} .card{min-height:300px}
}
</style>
</head>
<body>
<div class="top">
  <div>
    <div class="title">North American Flashcards</div>
    <button class="topbtn" id="sourceBtn">View prompt and 2 sources</button>
  </div>
  <div class="actions">
    <span class="action" title="Share" onclick="shareCard()">⌯</span>
    <span class="action" title="Fullscreen" onclick="document.documentElement.requestFullscreen?.()">⛶</span>
    <span class="action" title="Close" onclick="window.close()">×</span>
    <span class="action" title="Options" onclick="showOptions()">⋮</span>
  </div>
</div>

<div class="wrap">
  <div class="hint">Press 'Space' to flip; ← / → to navigate</div>
  <div class="card" id="card" onclick="flip()">
    <div class="menu">⋮</div>
    <div class="num" id="num"></div>
    <div id="content"></div>
    <div class="see" id="see">See answer</div>
  </div>

  <div class="controls">
    <button class="ctrl" onclick="prev()" title="Previous">←</button>
    <button id="wrongBtn" class="ctrl mark bad" onclick="mark(false);event.stopPropagation()" title="Incorrect — click again to untick">× <span id="wrong">0</span></button>
    <button id="rightBtn" class="ctrl mark good" onclick="mark(true);event.stopPropagation()" title="Correct — click again to untick"><span id="right">0</span> ✓</button>
    <button class="ctrl next" onclick="next()" title="Next">→</button>
  </div>
</div>
<div class="stats" id="stats"></div>

<script>
const cards = [{"question": "According to archaeological evidence, how and when did the earliest inhabitants of North America arrive on the continent?", "answer": "They migrated from Asia over 30,000 years ago across a land-bridge over the Bering Straits, moving further south during the last Ice Age 10,000 years ago."}, {"question": "What is the age of the oldest known human artifact discovered in North America?", "answer": "An arrow-point dated to approximately 11,000 years ago."}, {"question": "How did Native Americans traditionally view land ownership compared to European settlers?", "answer": "Native Americans did not believe in owning or commodifying land, water, or animals. They satisfied their needs from nature and treated goods as shared resources or gifts rather than property to buy and sell."}, {"question": "What were Wampum belts, and how were they used by Native American tribes?", "answer": "Wampum belts were belts made of colored shells sewn together, exchanged between native tribes as formal symbols of treaty agreements, friendship, and alliances."}, {"question": "The organized native groups officially recognized by the Canadian government are referred to as _____.", "answer": "First Nations peoples"}, {"question": "Why were indigenous peoples of the Americas historically referred to by Europeans as 'Red Indians'?", "answer": "Because Christopher Columbus misidentified the brown-complexioned indigenous inhabitants of the Americas as inhabitants of India."}, {"question": "In 18th-century Western Europe, what three criteria were used to define a 'civilized' society?", "answer": "1. Literacy\n2. An organized religion\n3. Urbanism (living in cities)"}, {"question": "Which French philosopher popularized the concept of the 'noble savage', admiring indigenous peoples as uncorrupted by civilization?", "answer": "Jean-Jacques Rousseau"}, {"question": "What was US President Thomas Jefferson's vision for the ideal American nation, and how did he view native peoples?", "answer": "Jefferson envisioned a country populated by European settlers owning small farms; he viewed natives as 'uncivilized' because they did not practice market farming or private land ownership, remarking that they 'justified extermination'."}, {"question": "In the history of the United States, what did the term 'shifting frontier' mean?", "answer": "It referred to the continuously moving western boundary of European-American settlement, which pushed native populations further inland as white settlers claimed more territory."}, {"question": "The vast territory purchased by the United States from France in 1803 was known as the _____.", "answer": "Louisiana Purchase"}, {"question": "From which country did the United States acquire Alaska in 1867?", "answer": "Russia"}, {"question": "Despite making extensive efforts to learn English and adopt American customs, how was the Cherokee tribe treated by the state of Georgia?", "answer": "The state of Georgia governed them by state laws but denied them the legal rights of citizens, attempting to seize their lands."}, {"question": "What was the ruling of US Chief Justice John Marshall in the 1832 Supreme Court case concerning the Cherokee tribe?", "answer": "Justice Marshall ruled that the Cherokees were a distinct sovereign community occupying their own territory, and that the laws of Georgia had no force within Cherokee land."}, {"question": "How did US President Andrew Jackson react to Chief Justice John Marshall's 1832 ruling regarding the Cherokees?", "answer": "Jackson refused to honor the Supreme Court judgment and commanded the US army to forcibly evict the Cherokees from their ancestral lands."}, {"question": "What was the 'Trail of Tears' (1838)?", "answer": "The forced march of 15,000 Cherokee people driven by the US military to the Great American Desert, during which over one-quarter of them died from hardship and disease."}, {"question": "Why did European-American settlers systematically slaughter wild bison on the North American prairies during the 19th century?", "answer": "To clear the land for farmland and to destroy the primary food source and lifestyle of the nomadic Plains Indians, forcing them onto reservations."}, {"question": "In North American history, what were 'reservations' or 'reserves'?", "answer": "Small, restricted areas of land to which native tribes were forcibly relocated and confined after being evicted from their ancestral territories."}, {"question": "Who were the Métis in Canada, and what actions did they take between 1869 and 1885?", "answer": "The Métis were people of mixed indigenous and European descent who staged armed revolts (such as the Red River Rebellion) against Canadian government encroachment on their lands."}, {"question": "What did the 1928 Meriam Report (*The Problem of Indian Administration*) reveal about US native reservations?", "answer": "It revealed a grim picture of extreme poverty, severe malnutrition, poor health conditions, and inadequate educational facilities on native reservations."}, {"question": "What key rights were granted to Native Americans by the Indian Reorganisation Act of 1934?", "answer": "It granted natives living on reservations the legal right to purchase land and secure government loans."}, {"question": "What condition did native leaders set in the 1954 'Declaration of Indian Rights' when accepting US citizenship?", "answer": "They demanded that their reservation lands would not be confiscated and that their cultural traditions and self-governance would not be interfered with."}, {"question": "Which 1982 legislative act formally recognized the existing aboriginal and treaty rights of native peoples in Canada?", "answer": "The Constitution Act of 1982"}, {"question": "Where does the name 'Canada' originate?", "answer": "From the Huron-Iroquois word 'kanata', meaning 'village', encountered by French explorer Jacques Cartier in 1534."}, {"question": "What core argument did Chief Seattle present in his 1854 response to the US President's request to buy native land?", "answer": "He stated that humans cannot buy or sell the air, water, or earth because nature is sacred and inseparable from the spirit of native ancestors."}, {"question": "How did the introduction of horses by the Spanish in the 17th century transform the lifestyle of Native Americans in the Great Plains?", "answer": "Horses enabled hunters to travel vastly greater distances across the grasslands to hunt bison efficiently, greatly enhancing their mobility and hunting productivity."}, {"question": "In 17th-century trade encounters along North American rivers, what goods did European traders provide in exchange for native fish and furs?", "answer": "Blankets, iron cooking vessels, firearms, and alcohol."}, {"question": "Why was the introduction of alcohol particularly advantageous to European traders in North America?", "answer": "Native Americans had no prior exposure to alcohol and quickly became addicted, allowing European merchants to exploit them and dictate terms of trade."}, {"question": "Which crop and habit did European traders adopt directly from Native Americans during early trade encounters?", "answer": "Tobacco (and tobacco smoking)"}, {"question": "How did historian William Macleish characterize North America prior to the arrival of European colonizers?", "answer": "As a continent of immense cultural diversity where people spoke over a hundred languages and sustained complex societies through hunting, fishing, gathering, and farming."}, {"question": "In colonial history, what is the exact definition of the term 'Native'?", "answer": "A person born in the place they live. Historically, Europeans used the term specifically to refer to the original inhabitants of lands they colonised."}, {"question": "In the 1960s, what methodology emerged that allowed indigenous peoples to record and publish their own histories?", "answer": "Oral history (dictating or recording oral traditions passed down through generations)."}, {"question": "Why was the academic field of Anthropology introduced in North America during the 1840s?", "answer": "It was introduced out of curiosity to study the perceived cultural differences between 'primitive' native communities and 'civilized' European societies."}, {"question": "How did author Washington Irving's firsthand observations of Native Americans contrast with popular European stereotypes?", "answer": "Irving found that when native people were seen in their natural environment, they possessed high pride, noble qualities, and poetical eloquence, contrasting with European portrayals of them as crude savages."}, {"question": "By what two primary mechanisms did the US federal government acquire new territories between 1783 and 1867?", "answer": "1. Direct purchase (e.g., Louisiana Purchase, Alaska, Gadsden Purchase)\n2. Military conquest/war (e.g., Mexican Cession of southern territories)"}, {"question": "How did the 1849 California Gold Rush impact Native American populations?", "answer": "It caused a massive influx of thousands of European and Asian prospectors, leading to widespread violent displacement, environmental destruction, and loss of native lives."}, {"question": "The term 'Amerind' or 'Amerindian' is an umbrella term used in English to describe _____.", "answer": "the indigenous peoples of North America, South America, and the Caribbean."}, {"question": "Name three major geographical landmarks or cities in North America whose names are derived from native words.", "answer": "1. Ohio (river/state)\n2. Mississippi (river/state)\n3. Saskatchewan (province in Canada)\n*(Other valid examples: Seattle, Quebec)*"}, {"question": "How did Native Americans understand the passage of time and historical record-keeping?", "answer": "They viewed time as moving in repeating cycles rather than a linear timeline, and transmitted origin stories and history orally through generations without written script."}, {"question": "European settlers noted that Native Americans had an extraordinary ability to 'read the land'. What did this mean?", "answer": "They possessed an intimate ecological understanding of climate variations, soil types, animal tracks, and landscapes, reading subtle natural cues as fluently as literate people read written texts."}, {"question": "How did European commercial trading differ fundamental from Native American economic practices?", "answer": "Europeans sought profit, accumulation of capital, and market sales. Native Americans exchanged goods to establish friendships, alliances, and social harmony without seeking profit."}, {"question": "In 1867, how did the British government resolve political friction with French settlers in Canada?", "answer": "By organizing Canada as a Confederation of autonomous states under the British crown."}, {"question": "How did German philosopher Karl Marx describe the 19th-century American frontier in his work *Grundrisse*?", "answer": "He described it as 'the last positive capitalist utopia... the limitless nature and space to which the limitless thirst for profit adapts itself'."}, {"question": "According to historian Howard Spodek, how did the outcomes of the American Revolution affect indigenous peoples versus European settlers?", "answer": "While settlers gained expansion, democracy, prosperity, and liberty, indigenous peoples experienced contraction, tyranny, poverty, and confinement."}, {"question": "During what timeframe did the US Army conduct a series of military campaigns known as the American Indian Wars to crush native resistance?", "answer": "1865 to 1890"}, {"question": "According to census data, how did the native population in the USA in 1820 compare to the native population in Spanish America in 1800?", "answer": "The USA had 0.6 million natives (out of 11.6 million total population), whereas Spanish America had 7.5 million natives (out of 16.9 million total population)."}, {"question": "What did the Hopi stone tablet prophecy state regarding visitors coming across the land?", "answer": "It foretold that their long-lost brothers and sisters would return as human beings appearing like turtles across the land (a metaphor matching armored Spanish Conquistadores)."}, {"question": "What happened to the Winnebago tribe of Wisconsin during the 1860s?", "answer": "They were forcibly removed by the US government from their ancestral home in Wisconsin to Nebraska."}, {"question": "How did early European objectives in North America differ from Spanish colonial objectives in South America?", "answer": "Spanish conquistadores in South America focused on extracting gold and silver, whereas early French and British adventurers in North America focused on trading furs and fish."}, {"question": "What was the purpose of the 1876 Canada Indians Act?", "answer": "It created a legal framework governing native 'bands' in Canada, placing them under state administration and restricting land rights."}, {"question": "Why did North American plantation owners import enslaved Africans via the Triangular Slave Trade?", "answer": "European settlers refused manual labor, and the native population had been largely decimated or evicted, creating a massive labor shortage for plantations and mines."}, {"question": "How did the 18th-century Industrial Revolution in Europe drive further land acquisition in North America?", "answer": "Mechanized factories required vast supplies of cheap raw agricultural materials (such as cotton and timber) and new colonial markets for finished manufactured goods."}, {"question": "In what geographic locations did native North American villages usually settle?", "answer": "Along major river systems (such as the Ohio and Mississippi rivers) where fishing, fertile soil for gardening, and freshwater were abundant."}, {"question": "Examine the historical map below illustrating the territorial expansion of the United States: Map of the United States showing territorial acquisitions from 1783 to 1867 including Louisiana Purchase and Mexican Cession Which major land acquisitions were purchased directly from European powers, and which were ceded by Mexico?", "answer": "Purchased from European powers:\n- Louisiana Purchase (1803 from France)\n- Florida (1819 from Spain)\n- Alaska (1867 from Russia)\n\nCeded by Mexico:\n- Southwestern territories and California (Ceded by Mexico in 1848 following war)."}, {"question": "How did European settlers justify taking native land despite native treaties?", "answer": "Settlers claimed natives were 'lazy' and 'uncivilized' for not maximizing agricultural production, market sales, or building towns, asserting they deserved to 'die out'."}];
let i=0, flipped=false;
let status = Array(cards.length).fill(0); // 0=unmarked, 1=correct, -1=incorrect

function countStatus(value){
  return status.filter(x => x === value).length;
}

const el=id=>document.getElementById(id);
function render(){
  const c=cards[i];
  el("num").textContent=(i+1)+"/"+cards.length;
  el("content").innerHTML=flipped
    ? '<div class="answer">'+escapeHtml(c.answer)+'</div>'
    : '<div class="q">'+escapeHtml(c.question)+'</div>';
  el("see").textContent=flipped ? "Click to flip back" : "See answer";
  const isCorrect = status[i] === 1;
  const isWrong = status[i] === -1;
  el("right").textContent=countStatus(1);
  el("wrong").textContent=countStatus(-1);
  el("rightBtn").classList.toggle("selected", isCorrect);
  el("wrongBtn").classList.toggle("selected", isWrong);
  el("stats").textContent="Card "+(i+1)+" of "+cards.length;
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function flip(){flipped=!flipped;render()}
function next(){i=(i+1)%cards.length;flipped=false;render()}
function prev(){i=(i-1+cards.length)%cards.length;flipped=false;render()}
function mark(ok){
  const value = ok ? 1 : -1;
  // Clicking the same button again unticks it.
  // Clicking the opposite button changes the card's status.
  status[i] = status[i] === value ? 0 : value;
  render();
}
function shareCard(){
  if(navigator.share) navigator.share({title:"North American Flashcards",text:cards[i].question});
  else navigator.clipboard?.writeText(cards[i].question);
}
function showOptions(){
  const action=prompt("Options: type 'shuffle' to shuffle, 'reset' to reset progress.");
  if(action?.toLowerCase()==="shuffle"){
    for(let j=cards.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[cards[j],cards[k]]=[cards[k],cards[j]]}
    i=0;flipped=false;render();
  } else if(action?.toLowerCase()==="reset"){
    status = Array(cards.length).fill(0); i=0; flipped=false; render();
  }
}
document.addEventListener("keydown",e=>{
  if(e.code==="Space"){e.preventDefault();flip()}
  else if(e.key==="ArrowRight") next();
  else if(e.key==="ArrowLeft") prev();
});
el("sourceBtn").onclick=()=>alert("Flashcards loaded from flashcards.csv. This version contains "+cards.length+" question-answer cards.");
render();
</script>
</body>
</html>
